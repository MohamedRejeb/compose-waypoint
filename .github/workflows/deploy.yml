name: Deploy Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        type: string

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/gradle.yml

  deploy:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          VERSION: ${{ github.event.inputs.version }}

  update-version:
    needs: deploy
    runs-on: ubuntu-latest
    # The bump is pushed to a branch and opened as a pull request.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The catalog version is what snapshots are built from (`<catalog>-SNAPSHOT`),
      # so after releasing X.Y.Z it moves to the next patch, X.Y.(Z+1), and the
      # following snapshots sort after the release. The docs keep showing the
      # released version.
      - name: Compute the next patch version
        id: next
        run: |
          released="${{ github.event.inputs.version }}"
          IFS=. read -r major minor patch <<< "$released"
          next="$major.$minor.$((patch + 1))"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Update the development version in libs.versions.toml
        run: sed -i "s/^waypoint = \".*\"/waypoint = \"${{ steps.next.outputs.version }}\"/" gradle/libs.versions.toml

      - name: Update versions in mkdocs.yml
        run: |
          if [ -f mkdocs.yml ]; then
            sed -i "s/^  waypoint_version: .*/  waypoint_version: '${{ github.event.inputs.version }}'/" mkdocs.yml
            sed -i "s/^  waypoint_snapshot_version: .*/  waypoint_snapshot_version: '${{ steps.next.outputs.version }}-SNAPSHOT'/" mkdocs.yml
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: bump version to ${{ steps.next.outputs.version }} after releasing ${{ github.event.inputs.version }}"
          title: "chore: bump version to ${{ steps.next.outputs.version }} after releasing ${{ github.event.inputs.version }}"
          branch: chore/bump-version-${{ steps.next.outputs.version }}
          body: |
            Automated bump after releasing `${{ github.event.inputs.version }}`: the catalog moves to `${{ steps.next.outputs.version }}` so snapshots become `${{ steps.next.outputs.version }}-SNAPSHOT`, and the docs show `${{ github.event.inputs.version }}`.
