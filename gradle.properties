#Gradle
org.gradle.jvmargs=-Xmx4048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx4048M"
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

kotlin.code.style=official

#MPP
kotlin.mpp.enableCInteropCommonization=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 opt-outs: keep com.android.library/application working next to the
# Kotlin Multiplatform plugin in the sample app module, which still applies
# both. The library modules use com.android.kotlin.multiplatform.library.
android.builtInKotlin=false
android.newDsl=false
